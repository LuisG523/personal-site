name = "libro-visitas"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://www.luisglopezcotelo.com"

[[d1_databases]]
binding = "DB"
database_name = "libro-visitas"
# Sustituye por el id que te devuelve: npx wrangler d1 create libro-visitas
database_id = "00000000-0000-0000-0000-000000000000"

# Secretos (no van en este archivo):
#   npx wrangler secret put ADMIN_TOKEN   -> contraseña del panel /admin
#   npx wrangler secret put IP_SALT       -> cualquier texto largo y aleatorio
